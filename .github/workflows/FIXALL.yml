name: FIX ALL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix the CPU decode
        run: |
          sed -i 's/0x7F3FFC00u) == 0x1E200000u/0x7F20FC00u) == 0x1E200000u/' \
            app/src/main/cpp/src/cpu_neon.cpp
          sed -i 's/if ((insn \& 0x1E000000u) == 0x1E000000u \&\& ((insn >> 28) \& 1u) == 0) {/if ((insn \& 0x5F000000u) == 0x1E000000u) {/' \
            app/src/main/cpp/src/dbt_cache.cpp
          echo "--- cpu_neon ---"
          grep -n "0x7F20FC00u" app/src/main/cpp/src/cpu_neon.cpp || echo "NEON PATCH MISSED"
          echo "--- dbt_cache ---"
          grep -n "0x5F000000u" app/src/main/cpp/src/dbt_cache.cpp || echo "DBT PATCH MISSED"

      - name: Write the fullscreen display
        run: |
          mkdir -p app/src/main/java/com/haseeb/emulator/ui/vm
          cat > app/src/main/java/com/haseeb/emulator/ui/vm/VmDisplayActivity.kt <<'EOF'
          package com.haseeb.emulator.ui.vm

          import android.os.Bundle
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.haseeb.emulator.Engine

          class VmDisplayActivity : ComponentActivity(), SurfaceHolder.Callback {

              private lateinit var surfaceView: SurfaceView
              private var exitTaps = 0
              private var lastTapAt = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
                  surfaceView = SurfaceView(this).apply {
                      holder.addCallback(this@VmDisplayActivity)
                      setOnTouchListener { _, event -> handleTouch(event) }
                  }
                  setContentView(surfaceView)
              }

              private fun handleTouch(event: MotionEvent): Boolean {
                  val now = System.currentTimeMillis()
                  if (event.actionMasked == MotionEvent.ACTION_DOWN && event.x < 120f && event.y < 120f) {
                      exitTaps = if (now - lastTapAt < 600) exitTaps + 1 else 1
                      lastTapAt = now
                      if (exitTaps >= 3) {
                          finish()
                          return true
                      }
                  }
                  if (!Engine.nativeLibraryLoaded) return true
                  val action = when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> 0
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> 1
                      else -> 2
                  }
                  for (i in 0 until event.pointerCount) {
                      Engine.sendTouch(action, event.getX(i).toInt(), event.getY(i).toInt(), i)
                  }
                  return true
              }

              override fun surfaceCreated(holder: SurfaceHolder) {
                  if (Engine.nativeLibraryLoaded) Engine.attachSurface(holder.surface)
              }

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                  if (Engine.nativeLibraryLoaded) Engine.attachSurface(holder.surface)
              }

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  if (Engine.nativeLibraryLoaded) Engine.attachSurface(null)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      WindowInsetsControllerCompat(window, window.decorView)
                          .hide(WindowInsetsCompat.Type.systemBars())
                  }
              }
          }
          EOF

      - name: Write MainActivity (auto fullscreen + file log)
        run: |
          cat > app/src/main/java/com/haseeb/emulator/MainActivity.kt <<'EOF'
          package com.haseeb.emulator

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Environment
          import androidx.activity.ComponentActivity
          import androidx.activity.SystemBarStyle
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.core.app.ActivityCompat
          import androidx.lifecycle.lifecycleScope
          import com.haseeb.emulator.ui.home.HomeScreen
          import com.haseeb.emulator.ui.theme.HaseebGamingTheme
          import com.haseeb.emulator.ui.vm.VmDisplayActivity
          import java.io.File
          import java.io.PrintWriter
          import java.io.StringWriter
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          class MainActivity : ComponentActivity() {

              private var displayLaunched = false
              private var lastLoggedLength = 0
              private var logFile: File? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  installCrashLogger()
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge(
                      statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
                      navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
                  )
                  requestStorageIfNeeded()
                  setContent { HaseebGamingTheme { HomeScreen() } }
                  startWatchers()
              }

              /** Opens the fullscreen guest display as soon as the VM starts, like other VM apps. */
              private fun startWatchers() {
                  lifecycleScope.launch {
                      while (true) {
                          delay(700)
                          runCatching {
                              if (Engine.nativeLibraryLoaded) {
                                  val running = Engine.isRunning()
                                  if (running && !displayLaunched) {
                                      displayLaunched = true
                                      startActivity(
                                          Intent(this@MainActivity, VmDisplayActivity::class.java)
                                      )
                                  } else if (!running) {
                                      displayLaunched = false
                                  }
                              }
                          }
                          flushLogs()
                      }
                  }
              }

              /** Appends the engine trace to HASEEB_EMULATOR/haseeblogs.txt. */
              private suspend fun flushLogs() {
                  withContext(Dispatchers.IO) {
                      runCatching {
                          if (!Engine.nativeLibraryLoaded) return@runCatching
                          val trace = Engine.readBootTrace(64 * 1024)
                          val tail = Engine.readLog(8 * 1024)
                          val combined = buildString {
                              append(trace)
                              if (tail.isNotBlank()) append("\n--- log ---\n").append(tail)
                          }
                          if (combined.length > lastLoggedLength) {
                              val fresh = combined.substring(lastLoggedLength)
                              lastLoggedLength = combined.length
                              val target = logTarget()
                              target.parentFile?.mkdirs()
                              target.appendText(fresh)
                          }
                      }
                  }
              }

              private fun logTarget(): File {
                  val preferred = File(Environment.getExternalStorageDirectory(), "HASEEB_EMULATOR/haseeblogs.txt")
                  return runCatching {
                      preferred.parentFile?.mkdirs()
                      if (!preferred.exists()) preferred.createNewFile()
                      preferred
                  }.getOrElse {
                      File(getExternalFilesDir(null) ?: filesDir, "haseeblogs.txt")
                  }
              }

              private fun requestStorageIfNeeded() {
                  if (android.os.Build.VERSION.SDK_INT <= 28 &&
                      checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE),
                          1001,
                      )
                  }
              }

              private fun installCrashLogger() {
                  val previous = Thread.getDefaultUncaughtExceptionHandler()
                  Thread.setDefaultUncaughtExceptionHandler { thread, error ->
                      runCatching {
                          val buffer = StringWriter()
                          error.printStackTrace(PrintWriter(buffer))
                          val text = "thread: ${thread.name}\n\n$buffer"
                          File(filesDir, "crash.txt").writeText(text)
                          logTarget().appendText("\n=== CRASH ===\n$text\n")
                      }
                      previous?.uncaughtException(thread, error)
                  }
              }
          }
          EOF

      - name: Patch the manifest
        run: |
          python3 - <<'PY'
          p = "app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "WRITE_EXTERNAL_STORAGE" not in s:
              s = s.replace("    <application",
                  '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n'
                  '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n\n'
                  '    <application', 1)
          if "VmDisplayActivity" not in s:
              e = ('        <activity\n'
                   '            android:name=".ui.vm.VmDisplayActivity"\n'
                   '            android:exported="false"\n'
                   '            android:hardwareAccelerated="true"\n'
                   '            android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation"\n'
                   '            android:theme="@style/Theme.HaseebGaming" />\n\n')
              s = s.replace("    </application>", e + "    </application>")
          open(p, "w", encoding="utf-8").write(s)
          print("manifest ok")
          PY

      - name: Android SDK + NDK + CMake
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q c.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"; echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: |
          gradle --no-daemon assembleDebug 2>&1 | tee build-full.log | tail -60
          exit ${PIPESTATUS[0]}

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haseeb-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build-full.log
          if-no-files-found: warn
