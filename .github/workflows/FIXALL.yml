name: FIX ALL
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix 1 - FP decode mask
        run: |
          sed -i 's/0x7F3FFC00u) == 0x1E200000u/0x7F20FC00u) == 0x1E200000u/' \
            app/src/main/cpp/src/cpu_neon.cpp
          grep -q "0x7F20FC00u" app/src/main/cpp/src/cpu_neon.cpp || (echo "MISS 1"; exit 1)

      - name: Fix 2 - scalar FP classifier
        run: |
          sed -i 's/if ((insn \& 0x1E000000u) == 0x1E000000u \&\& ((insn >> 28) \& 1u) == 0) {/if ((insn \& 0x5F000000u) == 0x1E000000u) {/' \
            app/src/main/cpp/src/dbt_cache.cpp
          grep -q "0x5F000000u" app/src/main/cpp/src/dbt_cache.cpp || (echo "MISS 2"; exit 1)

      - name: Fix 3 - FP conversions + syscall batch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Fix 4 - TLS align experiment
        run: |
          echo '' | base64 -d > /tmp/tlsfix.py
          python3 /tmp/tlsfix.py

      - name: Fix 5 - instruction ring buffer
        run: |
          echo '' | base64 -d > /tmp/trace.py
          python3 /tmp/trace.py

      - name: Fix 6 - ELF file-bytes diagnostic
        run: |
          echo '' | base64 -d > /tmp/diag.py
          python3 /tmp/diag.py

      - name: Fix 7 - build tag
        run: |
          python3 - <<'PY'
          import re
          p = "app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "1.2.0-trace"', s)
          open(p, "w", encoding="utf-8").write(s)
          print([l.strip() for l in s.split("\n") if "versionName" in l])
          PY

      - name: Android SDK + NDK + CMake
        run: |
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"; cd "$SDK"
          curl -sSLo c.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q c.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes 2>/dev/null | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cd "$GITHUB_WORKSPACE"; echo "sdk.dir=$SDK" > local.properties

      - name: Gradle
        run: |
          curl -sSLo /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/g.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee build-full.log | tail -40
          echo "GRADLE_RC=${PIPESTATUS[0]}"
          grep -nE "error:|error :|C/C\+\+: |undefined reference|FAILED:" build-full.log | grep -v "note:" | head -8 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Report build errors
        if: always()
        run: |
          set +e
          if [ -f build-full.log ]; then
            grep -E "error:|C/C\+\+: |undefined reference" build-full.log | grep -v "note:" | head -5 | while IFS= read -r l; do echo "::error title=compile::$l"; done
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haseeb-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build-full.log
          if-no-files-found: warn
