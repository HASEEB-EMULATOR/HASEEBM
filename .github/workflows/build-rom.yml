import android.content.Intent
import android.graphics.Color
import android.os.Bundle
import androidx.activity.ComponentActivity
import androidx.activity.SystemBarStyle
import androidx.activity.compose.setContent
import androidx.activity.enableEdgeToEdge
import androidx.compose.foundation.layout.Box
import androidx.compose.foundation.layout.fillMaxSize
import androidx.compose.foundation.layout.padding
import androidx.compose.material3.ExtendedFloatingActionButton
import androidx.compose.material3.Text
import androidx.compose.runtime.Composable
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.unit.dp
import com.haseeb.emulator.ui.home.HomeScreen
import com.haseeb.emulator.ui.theme.HaseebGamingTheme
import com.haseeb.emulator.ui.vm.VmDisplayActivity
import java.io.File
import java.io.PrintWriter
import java.io.StringWriter

class MainActivity : ComponentActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        installCrashLogger()
        super.onCreate(savedInstanceState)
        enableEdgeToEdge(
            statusBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
            navigationBarStyle = SystemBarStyle.dark(Color.TRANSPARENT),
        )
        setContent { HaseebGamingTheme { Root() } }
    }

    @Composable
    private fun Root() {
        Box(Modifier.fillMaxSize()) {
            HomeScreen()
            ExtendedFloatingActionButton(
                onClick = {
                    startActivity(Intent(this@MainActivity, VmDisplayActivity::class.java))
                },
                modifier = Modifier
                    .align(Alignment.BottomStart)
                    .padding(16.dp),
            ) { Text("Fullscreen") }
        }
    }

    private fun installCrashLogger() {
        val previous = Thread.getDefaultUncaughtExceptionHandler()
        Thread.setDefaultUncaughtExceptionHandler { thread, error ->
            runCatching {
                val buffer = StringWriter()
                error.printStackTrace(PrintWriter(buffer))
                File(filesDir, "crash.txt").writeText("thread: ${thread.name}\\n\\n$buffer")
            }
            previous?.uncaughtException(thread, error)
        }
    }
}
